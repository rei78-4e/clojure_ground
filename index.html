<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Clojure(Script) playground in the browser, powered by Scittle.">
<title>Clojure Playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%235881d8'/%3E%3Cpath d='M16 4a12 12 0 0 1 0 24' fill='%2363b132'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #d9dde3;
    --text: #1d2330;
    --muted: #667085;
    --accent: #3f6fd8;
    --accent-text: #ffffff;
    --ok: #2f7d32;
    --err: #c62828;
    --err-bg: #fdecec;
    --result: #3f6fd8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #21252b;
      --border: #343a44;
      --text: #d7dae0;
      --muted: #8b93a1;
      --accent: #6b9cff;
      --accent-text: #0d1117;
      --ok: #7cc47f;
      --err: #ff7b72;
      --err-bg: #3a1f22;
      --result: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0 auto 0 0; white-space: nowrap; }
  h1 small { color: var(--muted); font-weight: normal; }
  select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    min-height: 34px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: progress; }
  kbd { font: 11px var(--mono); opacity: .8; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0;
  }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-title {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px; min-height: 33px;
    font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .pane-title span:first-child { margin-right: auto; text-transform: uppercase; letter-spacing: .05em; }
  .pane-title button { min-height: 24px; padding: 2px 8px; font-size: 12px; }
  #editor { flex: 1; min-height: 0; overflow: hidden; background: var(--panel); }
  #editor .cm-editor { height: 100%; font-size: 14px; }
  #editor .cm-scroller { font-family: var(--mono); }
  #editor .cm-error-line { background: color-mix(in srgb, var(--err) 18%, transparent); }
  #output-wrap { flex: 1; min-height: 0; overflow: auto; background: var(--panel); }
  .sandbox { display: block; width: 100%; height: 0; border: 0; }
  .sandbox[hidden] { display: none; }
  .sandbox.has-content { border-bottom: 1px dashed var(--border); }
  #out {
    margin: 0; padding: 12px;
    font: 13px/1.5 var(--mono);
    white-space: pre-wrap; word-break: break-word;
  }
  #out .stdout { color: var(--text); }
  #out .stderr { color: var(--err); }
  #out .result { color: var(--result); }
  #out .result::before { content: "=> "; color: var(--muted); }
  #out .note { color: var(--muted); font-style: italic; }
  #out .error {
    display: block; color: var(--err); background: var(--err-bg);
    border-left: 3px solid var(--err); padding: 6px 10px; margin: 4px 0; border-radius: 4px;
  }
  #out .error button {
    font: inherit; font-size: 12px; min-height: 0; padding: 1px 6px; margin-left: 6px;
    color: var(--err); background: transparent; border-color: var(--err);
  }
  #status { font-size: 12px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--err); }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; }
  #tabbar, #keybar { display: none; }

  /* ---- phone layout: one pane at a time, controls at the bottom (thumb reach) */
  @media (max-width: 800px) {
    html { overscroll-behavior: none; }
    /* --app-h follows the visual viewport so the bars sit right above the soft keyboard */
    body { height: var(--app-h, 100dvh); min-height: 0; overflow: hidden; }
    button, select { touch-action: manipulation; }
    header { flex-wrap: nowrap; padding-top: max(8px, env(safe-area-inset-top)); }
    h1 { font-size: 15px; margin-right: 4px; flex-shrink: 0; }
    h1 small, header #run, .hide-sm { display: none; }
    header select { flex: 1; min-width: 0; min-height: 40px; }
    header #share { min-height: 40px; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    body[data-view="code"] #pane-output,
    body[data-view="output"] #pane-editor { display: none; }
    .pane + .pane { border-left: 0; }
    #pane-editor .pane-title { display: none; }
    .pane-title button { min-height: 36px; padding: 4px 14px; }
    #editor .cm-editor { font-size: 16px; } /* >= 16px prevents iOS focus zoom */
    #out { font-size: 14px; }
    #out .error button { min-height: 32px; padding: 4px 10px; margin: 6px 0 0; display: block; }
    #toast { bottom: calc(72px + env(safe-area-inset-bottom)); }

    #tabbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      border-top: 1px solid var(--border); background: var(--panel);
    }
    .tabs { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .tabs button { border: 0; background: transparent; min-height: 40px; padding: 0 16px; border-radius: 7px; color: var(--muted); position: relative; }
    .tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
    .tabs button[data-badge]::after {
      content: ""; position: absolute; top: 7px; right: 6px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
    }
    .tabs button[data-badge="err"]::after { background: var(--err); }
    #status-m { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    #status-m.ok { color: var(--ok); }
    #status-m.bad { color: var(--err); }
    #tabbar .run { min-height: 46px; min-width: 96px; font-size: 16px; border-radius: 10px; }

    /* while typing: hide header + tab bar, show a symbol/cursor key row above the keyboard */
    body.typing header, body.typing #tabbar { display: none; }
    body.typing #keybar {
      display: flex; align-items: stretch; gap: 6px;
      padding: 5px max(6px, env(safe-area-inset-right)) 5px max(6px, env(safe-area-inset-left));
      border-top: 1px solid var(--border); background: var(--panel);
    }
    .keys { flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .keys::-webkit-scrollbar { display: none; }
    #keybar button { flex: none; min-width: 38px; min-height: 42px; padding: 0 6px; font: 17px var(--mono); border-radius: 7px; user-select: none; -webkit-user-select: none; }
    #keybar .act { font-family: inherit; font-size: 16px; color: var(--muted); }
    #keybar .run { font: 600 15px system-ui, sans-serif; padding: 0 12px; }
  }
</style>

<!-- Document for the sandbox iframe. Every Run gets a fresh one and the previous
     one is removed, which stops all of its timers, promises and listeners.
     sandbox="allow-scripts" without allow-same-origin gives it an opaque origin,
     so user code cannot touch this page; it talks to us via postMessage only. -->
<template id="sandbox-src">
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  body { margin: 0; display: flow-root; color: #1d2330; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { body { color: #d7dae0; } }
  #stage:not(:empty) { padding: 12px; }
</style>
<div id="stage"></div>
<script src="https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/scittle@0.8.33/dist/scittle.pprint.js" crossorigin="anonymous"></script>
<script>
(() => {
  const send = (m) => parent.postMessage(m, "*");
  if (!window.scittle) return send({ t: "fatal", message: "Could not load Scittle from the CDN. Check your connection and reload." });
  const evalString = (src) => scittle.core.eval_string(src);
  window.__send = send;
  let fmt, errInfo;
  try {
    evalString(`
(ns playground.internal
  (:require [cljs.pprint :as pp]))

(set! *print-newline* true)
(set! *print-fn* (fn [& xs] (js/__send #js {:t "out" :s (apply str xs)})))
(set! *print-err-fn* (fn [& xs] (js/__send #js {:t "out" :s (apply str xs) :err true})))

(defn fmt [v]
  (let [s (pr-str v)]
    (if (and (> (count s) 72) (coll? v))
      (-> (with-out-str (pp/pprint v))
          (.replace (js/RegExp. " +$" "gm") "")
          (.trimEnd))
      s)))

(defn- user-data
  "ex-data from the user's own ex-info, ignoring SCI/reader metadata."
  [m]
  (when (and (map? m) (not (#{"sci" "sci.error" "edamame"} (some-> (:type m) namespace))))
    m))

(defn err-info [e]
  (let [d     (ex-data e)
        cause (ex-cause e)
        user  (or (user-data (some-> cause ex-data)) (user-data d))]
    #js {:message (or (some-> cause ex-message) (ex-message e) (str e))
         :line    (:line d)
         :column  (:column d)
         :phase   (some-> (:phase d) name)
         :data    (when (seq user) (pr-str user))}))
`);
    fmt = evalString("playground.internal/fmt");
    errInfo = evalString("playground.internal/err-info");
  } catch (e) {
    return send({ t: "fatal", message: "Scittle failed to start: " + e });
  }
  const safeFmt = (v) => { try { return fmt(v); } catch { return String(v); } };
  const info = (e) => {
    try { const i = errInfo(e); return { message: i.message, line: i.line, column: i.column, phase: i.phase, data: i.data }; }
    catch { return { message: String((e && e.message) || e) }; }
  };

  // Errors thrown later, from timers or event handlers created by user code
  addEventListener("error", (ev) => send({ t: "error", info: info(ev.error ?? ev.message) }));
  addEventListener("unhandledrejection", (ev) => send({ t: "error", info: info(ev.reason) }));
  addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send({ t: "run" }); }
  });
  new ResizeObserver(() => send({ t: "height", h: Math.ceil(document.body.getBoundingClientRect().height) }))
    .observe(document.body);

  addEventListener("message", (ev) => {
    if (ev.source !== parent || !ev.data || ev.data.t !== "eval") return;
    const t0 = performance.now();
    try {
      const value = evalString(ev.data.code);
      const ms = Math.round(performance.now() - t0);
      if (value instanceof Promise) {
        send({ t: "pending", ms });
        value.then((v) => send({ t: "result", s: safeFmt(v) }),
                   (e) => send({ t: "error", info: info(e), final: true }));
      } else {
        send({ t: "result", s: safeFmt(value), ms });
      }
    } catch (e) {
      send({ t: "error", info: info(e), final: true });
    }
  });
  send({ t: "ready" });
})();
</script>
</template>

<script type="module">
import { EditorView, keymap, lineNumbers, highlightActiveLine, highlightActiveLineGutter,
         drawSelection, Decoration } from "@codemirror/view";
import { EditorState, Compartment, StateField, StateEffect, Prec } from "@codemirror/state";
import { defaultKeymap, history, historyKeymap, indentWithTab, cursorCharLeft, cursorCharRight,
         indentSelection, selectParentSyntax, undo, redo } from "@codemirror/commands";
import { syntaxHighlighting, defaultHighlightStyle, bracketMatching, indentOnInput } from "@codemirror/language";
import { closeBrackets, closeBracketsKeymap, insertBracket } from "@codemirror/autocomplete";
import { oneDark } from "@codemirror/theme-one-dark";
import { clojure } from "@nextjournal/lang-clojure";

// ---------------------------------------------------------------- examples
const EXAMPLES = {
  "Basics": `;; Basics: values, functions, let and conditionals
(defn greet [name]
  (str "Hello, " name "!"))

(println (greet "Clojure"))

(defn fizzbuzz [n]
  (cond
    (zero? (mod n 15)) "FizzBuzz"
    (zero? (mod n 3))  "Fizz"
    (zero? (mod n 5))  "Buzz"
    :else n))

(println (map fizzbuzz (range 1 16)))

;; The value of the last form is shown as the result
(let [x 10
      y 32]
  (+ x y))
`,
  "Collections": `;; Collections: vectors, maps, sets and sequence functions
(def people
  [{:name "Ada"   :lang :clojure :age 36}
   {:name "Rich"  :lang :clojure :age 52}
   {:name "Grace" :lang :cobol   :age 85}
   {:name "Alan"  :lang :lisp    :age 41}])

(println "names:" (mapv :name people))
(println "langs:" (set (map :lang people)))

(prn (->> people
          (filter #(> (:age %) 40))
          (sort-by :age)
          (map (juxt :name :age))))

(let [{:keys [name age]} (first people)]
  (println name "is" age))

(println (frequencies "mississippi"))
(println (update-in {:a {:b 1}} [:a :b] inc))

;; group-by returns a map of key -> vector
(update-vals (group-by :lang people) #(mapv :name %))
`,
  "Atoms": `;; Atoms: managed, synchronous state
(def counter (atom 0))

(add-watch counter :log
  (fn [_ _ old new]
    (println "counter:" old "->" new)))

(swap! counter inc)
(swap! counter + 10)
(reset! counter 100)

;; A validator rejects invalid states
(def balance (atom 50 :validator #(>= % 0)))

(defn withdraw! [amount]
  (try
    (swap! balance - amount)
    (println "withdrew" amount "-> balance" @balance)
    (catch :default _
      (println "rejected withdrawal of" amount))))

(withdraw! 30)
(withdraw! 30)

{:counter @counter :balance @balance}
`,
  "core.async-style loops": `;; core.async is not bundled with Scittle, so this emulates a
;; go-loop producer/consumer with a tiny channel built on Promises.
(defn timeout [ms]
  (js/Promise. (fn [resolve] (js/setTimeout resolve ms))))

(defn chan [] (atom {:buf [] :takers []}))

(defn put! [ch v]
  (if-let [taker (first (:takers @ch))]
    (do (swap! ch update :takers subvec 1)
        (taker v))
    (swap! ch update :buf conj v)))

(defn take! [ch]
  (js/Promise.
    (fn [resolve]
      (if-let [[v] (seq (:buf @ch))]
        (do (swap! ch update :buf subvec 1)
            (resolve v))
        (swap! ch update :takers conj resolve)))))

;; "go-loop": each step waits on a Promise, then recurs
(defn producer [ch n]
  (letfn [(step [i]
            (if (< i n)
              (do (println "put" i)
                  (put! ch i)
                  (.then (timeout 300) (fn [_] (step (inc i)))))
              (put! ch :done)))]
    (step 0)))

(defn consumer [ch acc]
  (.then (take! ch)
         (fn [v]
           (if (= v :done)
             (do (println "consumer done") acc)
             (do (println "  took" v)
                 (consumer ch (conj acc (* v v))))))))

(def ch (chan))
(producer ch 5)
;; A Promise result is awaited and its value shown when it resolves
(consumer ch [])
`,
  "DOM manipulation": `;; DOM: build elements inside the #stage area above the output
(def stage (.getElementById js/document "stage"))
(set! (.-innerHTML stage) "")

(defn el [tag attrs & children]
  (let [node (.createElement js/document tag)]
    (doseq [[k v] attrs]
      (if (= k :style)
        (set! (.. node -style -cssText) v)
        (.setAttribute node (name k) v)))
    (doseq [c children]
      (.append node (if (string? c) (.createTextNode js/document c) c)))
    node))

(def clicks (atom 0))
(def label (el "span" {:style "margin-left:8px"} "clicked 0 times"))

(def button
  (el "button" {:type "button"} "Click me"))

(.addEventListener button "click"
  (fn [_]
    (swap! clicks inc)
    (set! (.-textContent label) (str "clicked " @clicks " times"))
    (println "click" @clicks)))

(def swatches
  (apply el "div" {:style "display:flex;gap:6px;margin-top:10px"}
    (for [hue (range 0 360 45)]
      (el "div" {:title (str "hue " hue)
                 :style (str "width:28px;height:28px;border-radius:50%;"
                             "background:hsl(" hue ",70%,55%)")}))))

(.append stage (el "h3" {:style "margin:0 0 8px"} "Hello from ClojureScript")
                (el "div" {} button label)
                swatches)

(str "children in #stage: " (.-childElementCount stage))
`
};

// ------------------------------------------------------------- dom helpers
const $ = (id) => document.getElementById(id);
const outEl = $("out"), statusEl = $("status"), runBtn = $("run");

function setStatus(text, cls = "") {
  for (const el of [statusEl, $("status-m")]) { el.textContent = text; el.className = cls; }
}

// Phone layout: only one pane is visible at a time.
const narrow = matchMedia("(max-width: 800px)");
const coarse = matchMedia("(pointer: coarse)");
function showView(name) {
  document.body.dataset.view = name;
  $("tab-code").setAttribute("aria-selected", name === "code");
  $("tab-output").setAttribute("aria-selected", name === "output");
  if (name === "output") delete $("tab-output").dataset.badge;
}
// Dot on the Output tab when something is printed while the code pane is shown
function flagOutput(isError) {
  if (!narrow.matches || document.body.dataset.view === "output") return;
  const tab = $("tab-output");
  if (isError) tab.dataset.badge = "err";
  else if (!tab.dataset.badge) tab.dataset.badge = "new";
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function scrollOut() { const w = $("output-wrap"); w.scrollTop = w.scrollHeight; }

// Consecutive stdout chunks are merged into one text node.
let lastSpan = null;
function write(text, cls) {
  if (lastSpan && lastSpan.dataset.cls === cls && cls !== "result") {
    lastSpan.textContent += text;
  } else {
    lastSpan = document.createElement("span");
    lastSpan.dataset.cls = cls;
    lastSpan.className = cls;
    lastSpan.textContent = text;
    outEl.append(lastSpan);
  }
  flagOutput(cls === "stderr");
  scrollOut();
}
function writeLine(text, cls) {
  if (outEl.textContent && !outEl.textContent.endsWith("\n")) write("\n", "stdout");
  write(text + "\n", cls);
  lastSpan = null;
}
function clearOutput() { outEl.textContent = ""; lastSpan = null; }

// --------------------------------------------------------------- sandbox
const SANDBOX_HTML = $("sandbox-src").innerHTML;
let sandbox = null;   // iframe of the current run
let spare = null;     // next iframe, loaded in advance so Run starts instantly

function makeSandbox() {
  const f = document.createElement("iframe");
  f.className = "sandbox";
  f.title = "Program DOM output";
  f.hidden = true;
  f.setAttribute("sandbox", "allow-scripts allow-modals");
  f.ready = new Promise((resolve, reject) => { f.resolveReady = resolve; f.rejectReady = reject; });
  f.srcdoc = SANDBOX_HTML;
  $("sandboxes").append(f);
  return f;
}

function stopSandbox() {
  if (sandbox) { sandbox.remove(); sandbox = null; }
}

function showError(info) {
  const box = document.createElement("span");
  box.className = "error";
  const where = info.line ? ` (line ${info.line}${info.column ? `, col ${info.column}` : ""})` : "";
  box.append(`${info.phase === "parse" ? "Syntax error" : "Error"}${where}: ${info.message}`);
  if (info.data) box.append(`\n${info.data}`);
  if (info.line) {
    const go = document.createElement("button");
    go.type = "button"; go.textContent = "Go to line";
    go.onclick = () => { showView("code"); gotoLine(info.line, info.column); };
    box.append(go);
    markErrorLine(info.line);
  }
  if (outEl.textContent && !outEl.textContent.endsWith("\n")) write("\n", "stdout");
  outEl.append(box);
  lastSpan = null;
  flagOutput(true);
  scrollOut();
}

addEventListener("message", (ev) => {
  const m = ev.data;
  if (!m || typeof m.t !== "string") return;
  if (spare && ev.source === spare.contentWindow) {
    if (m.t === "ready") spare.resolveReady();
    if (m.t === "fatal") spare.rejectReady(new Error(m.message));
    return;
  }
  // Anything from an iframe other than the current run's is ignored
  if (!sandbox || ev.source !== sandbox.contentWindow) return;
  switch (m.t) {
    case "out": write(m.s, m.err ? "stderr" : "stdout"); break;
    case "pending":
      writeLine("Promise pending…", "note");
      setStatus(`Running async… ${m.ms} ms`);
      break;
    case "result":
      writeLine(m.s, "result");
      setStatus(m.ms == null ? "Done" : `Done in ${m.ms} ms`, "ok");
      break;
    case "error":
      showError(m.info);
      if (m.final) setStatus("Error", "bad");
      break;
    case "height":
      sandbox.style.height = m.h + "px";
      sandbox.classList.toggle("has-content", m.h > 0);
      break;
    case "run": run(); break;
  }
});

async function run() {
  if (runBtn.disabled) return;
  const code = view.state.doc.toString();
  if (narrow.matches) { view.contentDOM.blur(); showView("output"); }
  clearOutput();
  markErrorLine(null);
  stopSandbox();
  sandbox = spare || makeSandbox();
  spare = null;
  sandbox.hidden = false;
  const current = sandbox;
  setStatus("Running…");
  try {
    await current.ready;
  } catch (e) {
    setStatus("Scittle failed to load", "bad");
    writeLine(e.message, "stderr");
    return;
  }
  if (current !== sandbox) return;  // another Run or Clear happened meanwhile
  current.contentWindow.postMessage({ t: "eval", code }, "*");
  // Prepare the next one once this run's synchronous part is likely done
  setTimeout(() => { if (!spare) spare = makeSandbox(); }, 0);
}

// ---------------------------------------------------------------- editor
const setErrorLine = StateEffect.define();
const errorLineField = StateField.define({
  create: () => Decoration.none,
  update(deco, tr) {
    for (const e of tr.effects) if (e.is(setErrorLine)) {
      if (e.value == null || e.value > tr.state.doc.lines) return Decoration.none;
      const line = tr.state.doc.line(e.value);
      return Decoration.set([Decoration.line({ class: "cm-error-line" }).range(line.from)]);
    }
    return tr.docChanged ? Decoration.none : deco;
  },
  provide: (f) => EditorView.decorations.from(f)
});
function markErrorLine(n) { view.dispatch({ effects: setErrorLine.of(n) }); }

function gotoLine(n, col = 1) {
  const line = view.state.doc.line(Math.min(n, view.state.doc.lines));
  const pos = Math.min(line.from + Math.max(col - 1, 0), line.to);
  view.dispatch({ selection: { anchor: pos }, effects: EditorView.scrollIntoView(pos, { y: "center" }) });
  view.focus();
}

const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const themeConf = new Compartment();
const themeFor = (dark) => dark ? oneDark : syntaxHighlighting(defaultHighlightStyle, { fallback: true });

const wrapConf = new Compartment();

const DRAFT_KEY = "clojure-playground:draft";
let saveTimer;
const saveDraft = EditorView.updateListener.of((u) => {
  if (!u.docChanged) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, u.state.doc.toString()); } catch {} }, 400);
});

const view = new EditorView({
  parent: $("editor"),
  state: EditorState.create({
    doc: "",
    extensions: [
      Prec.highest(keymap.of([{ key: "Mod-Enter", run: () => { run(); return true; } }])),
      lineNumbers(), highlightActiveLineGutter(), highlightActiveLine(),
      history(), drawSelection(), indentOnInput(), bracketMatching(), closeBrackets(),
      keymap.of([...closeBracketsKeymap, ...defaultKeymap, ...historyKeymap, indentWithTab]),
      clojure(),
      themeConf.of(themeFor(darkQuery.matches)),
      wrapConf.of(narrow.matches ? EditorView.lineWrapping : []),
      errorLineField, saveDraft,
      EditorView.contentAttributes.of({ "aria-label": "Clojure code", autocapitalize: "off", autocorrect: "off", spellcheck: "false" })
    ]
  })
});
darkQuery.addEventListener("change", (e) => view.dispatch({ effects: themeConf.reconfigure(themeFor(e.matches)) }));
narrow.addEventListener("change", (e) => view.dispatch({ effects: wrapConf.reconfigure(e.matches ? EditorView.lineWrapping : []) }));

function setCode(code) {
  view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: code }, selection: { anchor: 0 } });
}

// ---------------------------------------------------------------- sharing
// Hash format: #z=<base64url(deflate-raw(utf8))>, or #s=<base64url(utf8)>
// when the browser lacks CompressionStream.
function toB64u(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64u(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}
const pipe = async (bytes, stream) =>
  new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());

async function encodeCode(code) {
  const bytes = new TextEncoder().encode(code);
  if (typeof CompressionStream === "function") return "z=" + toB64u(await pipe(bytes, new CompressionStream("deflate-raw")));
  return "s=" + toB64u(bytes);
}
async function decodeHash(hash) {
  const m = /^#?([zs])=(.+)$/.exec(hash);
  if (!m) return null;
  let bytes = fromB64u(m[2]);
  if (m[1] === "z") bytes = await pipe(bytes, new DecompressionStream("deflate-raw"));
  return new TextDecoder().decode(bytes);
}

async function share() {
  const hash = await encodeCode(view.state.doc.toString());
  window.history.replaceState(null, "", "#" + hash);
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    toast(`Link copied (${url.length} chars)`);
  } catch {
    toast("Link is in the address bar");
  }
}

async function loadFromHash() {
  try {
    const code = await decodeHash(location.hash);
    if (code != null) { setCode(code); return true; }
  } catch (e) {
    writeLine("Could not decode the shared link: " + e.message, "stderr");
  }
  return false;
}

// ------------------------------------------------------------------ wiring
const select = $("examples");
for (const name of Object.keys(EXAMPLES)) select.append(new Option(name, name));
select.addEventListener("change", () => {
  setCode(EXAMPLES[select.value]);
  if (location.hash) window.history.replaceState(null, "", location.pathname + location.search);
  select.selectedIndex = 0;
  if (narrow.matches) showView("code"); else view.focus();
});

runBtn.addEventListener("click", run);
$("run-m").addEventListener("click", run);
$("tab-code").addEventListener("click", () => showView("code"));
$("tab-output").addEventListener("click", () => showView("output"));
$("share").addEventListener("click", share);
// Clear also stops the program (timers, intervals, listeners)
$("clear").addEventListener("click", () => {
  clearOutput(); markErrorLine(null);
  if (sandbox) { stopSandbox(); setStatus("Stopped"); }
});
window.addEventListener("hashchange", loadFromHash);
// Ctrl/Cmd+Enter also works when focus is outside the editor
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !view.hasFocus) { e.preventDefault(); run(); }
});

// ------------------------------------------------------------ phone input
// Keep the layout as tall as the visual viewport, so that the key row and the
// editor stay above the on-screen keyboard (iOS does not resize the layout).
const vv = window.visualViewport;
let fullH = 0, keyboardSeen = false;
function fitViewport() {
  if (!vv || !narrow.matches || vv.scale > 1.01) {
    document.documentElement.style.removeProperty("--app-h");
    return;
  }
  fullH = Math.max(fullH, vv.height);
  document.documentElement.style.setProperty("--app-h", vv.height + "px");
  window.scrollTo(0, 0);
  // Android's back gesture hides the keyboard without blurring the editor
  const keyboardOpen = vv.height < fullH - 120;
  if (keyboardOpen) keyboardSeen = true;
  else if (keyboardSeen) { keyboardSeen = false; document.body.classList.remove("typing"); }
}
vv?.addEventListener("resize", fitViewport);
vv?.addEventListener("scroll", fitViewport);
addEventListener("orientationchange", () => { fullH = 0; });
narrow.addEventListener("change", fitViewport);
fitViewport();

view.contentDOM.addEventListener("focus", () => {
  if (narrow.matches && coarse.matches) document.body.classList.add("typing");
});
view.contentDOM.addEventListener("blur", () => {
  document.body.classList.remove("typing");
  keyboardSeen = false;
});

const KEYS = ["(", "[", "{", '"', ":", "-", "←", "→", "#", "@", "'", "⇥", ")", "]", "}",
              "↶", "↷", "⤢", "%", "/", ";", "&", "!", "?", "=", "<", ">", "*", "~", "^", "`", "\\"];
const ACTIONS = {
  "←": [cursorCharLeft, "Cursor left"], "→": [cursorCharRight, "Cursor right"],
  "⇥": [indentSelection, "Re-indent line"], "⤢": [selectParentSyntax, "Expand selection to enclosing form"],
  "↶": [undo, "Undo"], "↷": [redo, "Redo"]
};
for (const k of KEYS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = k; b.dataset.key = k;
  if (ACTIONS[k]) { b.className = "act"; b.setAttribute("aria-label", ACTIONS[k][1]); b.title = ACTIONS[k][1]; }
  $("keys").append(b);
}

function pressKey(k) {
  if (ACTIONS[k]) { ACTIONS[k][0](view); return; }
  // insertBracket gives the same auto-pairing / skip-over as typing the key
  const tr = "([{\")]}".includes(k) && insertBracket(view.state, k);
  view.dispatch(tr || view.state.update(view.state.replaceSelection(k), { userEvent: "input.type" }));
  view.dispatch({ effects: EditorView.scrollIntoView(view.state.selection.main.head) });
}

// Preventing the default of pointerdown/mousedown keeps focus (and the soft
// keyboard) in the editor. Keys fire on click, so a horizontal drag over the
// key row scrolls it instead of typing; the arrows act at once and repeat while held.
let repeatTimer;
const stopRepeat = () => clearTimeout(repeatTimer);
const isArrow = (k) => k === "←" || k === "→";
for (const ev of ["pointerdown", "mousedown"]) {
  $("keybar").addEventListener(ev, (e) => { if (e.target.closest("button")) e.preventDefault(); });
}
$("keybar").addEventListener("pointerdown", (e) => {
  const k = e.target.closest("button")?.dataset.key;
  if (!isArrow(k)) return;
  pressKey(k);
  const loop = (delay) => { repeatTimer = setTimeout(() => { pressKey(k); loop(60); }, delay); };
  loop(400);
});
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) $("keybar").addEventListener(ev, stopRepeat);
$("keybar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act === "run") return run();
  if (b.dataset.act === "done") return view.contentDOM.blur();
  if (!isArrow(b.dataset.key)) pressKey(b.dataset.key);
});

if (!(await loadFromHash())) {
  let draft = null;
  try { draft = localStorage.getItem(DRAFT_KEY); } catch {}
  setCode(draft || EXAMPLES["Basics"]);
}

spare = makeSandbox();
try {
  await spare.ready;
  runBtn.disabled = $("run-m").disabled = false;
  setStatus("Ready");
} catch (e) {
  setStatus("Scittle failed to load", "bad");
  writeLine(e.message, "stderr");
}
</script>
</body>
